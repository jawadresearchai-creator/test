name: R7 B02 MetaMask Selector Memoization

on:
  push:
    branches:
      - r6-benchmark-harness-2026-09-08
    paths:
      - '.github/workflows/r7-b02-metamask-selector.yml'
      - 'benchmarks/r7-b02-trigger.txt'
  workflow_dispatch:

jobs:
  b02-oracle:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        case:
          - name: pre_fix
            sha: 8e156ce8cabc6c89451bd8b91873646bc2740fbd
            implementation: deep_equal_lru
            expected_alternating_recomputations: 6
          - name: human_fix
            sha: 0439337d1c7456a9c18772daed85b07d0f7ee8d0
            implementation: primitive_weakmap
            expected_alternating_recomputations: 2

    steps:
      - name: Checkout benchmark harness
        uses: actions/checkout@v4

      - name: Checkout exact historical MetaMask source
        shell: bash
        run: |
          set -euxo pipefail
          git clone --filter=blob:none --no-checkout https://github.com/MetaMask/metamask-mobile.git metamask-mobile
          cd metamask-mobile
          git checkout "${{ matrix.case.sha }}"
          test "$(git rev-parse HEAD)" = "${{ matrix.case.sha }}"

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Verify exact historical source shape
        shell: bash
        run: |
          set -euxo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import json
          import os

          source = Path('metamask-mobile/app/selectors/assets/assets-list.ts').read_text()
          util = Path('metamask-mobile/app/selectors/util.ts').read_text()
          package = json.loads(Path('metamask-mobile/package.json').read_text())
          mode = os.environ['MODE']

          assert package['dependencies']['reselect'] == '^5.1.1', package['dependencies']['reselect']
          assert package['dependencies']['fast-equals'] == '^5.2.2', package['dependencies']['fast-equals']

          required_util = [
              'createSelectorCreator',
              'lruMemoize',
              'deepEqual',
              'createDeepEqualSelector = createSelectorCreator',
          ]
          for token in required_util:
              assert token in util, f'missing historical util anchor: {token}'

          if mode == 'deep_equal_lru':
              assert 'export const selectAsset = createDeepEqualSelector(' in source
              assert ') => params,' in source
              assert ') => params.address,' not in source
              print('SOURCE_GUARD: pre-fix selectAsset uses createDeepEqualSelector with whole params object')
          elif mode == 'primitive_weakmap':
              assert "import { createSelector } from 'reselect';" in source
              assert 'export const selectAsset = createSelector(' in source
              for token in [') => params.address,', ') => params.chainId,', ') => params.isStaked,']:
                  assert token in source, f'missing fixed primitive input: {token}'
              print('SOURCE_GUARD: accepted fix uses createSelector with split primitive params')
          else:
              raise AssertionError(f'unknown mode: {mode}')
          PY
        env:
          MODE: ${{ matrix.case.implementation }}

      - name: Resolve direct historical memoization dependency versions
        shell: bash
        run: |
          set -euxo pipefail
          python3 - <<'PY' > /tmp/versions.env
          from pathlib import Path
          import re

          text = Path('metamask-mobile/yarn.lock').read_text()

          def versions_for(package):
              values = re.findall(rf'resolution:\s+"{re.escape(package)}@npm:([^"\s]+)"', text)
              if not values:
                  raise SystemExit(f'Could not resolve {package} from historical yarn.lock')
              return sorted(set(values), key=lambda v: tuple(int(x) for x in re.match(r'^(\d+)\.(\d+)\.(\d+)', v).groups()))

          # The lock contains transitive Reselect 4.x as well as the app's direct
          # Reselect 5.x dependency. package.json pins the direct range at ^5.1.1,
          # so select the highest locked version satisfying that major.
          reselect = [v for v in versions_for('reselect') if v.startswith('5.')]
          fast_equals = [v for v in versions_for('fast-equals') if v.startswith('5.')]
          if not reselect or not fast_equals:
              raise SystemExit('Direct dependency major not found in historical yarn.lock')

          print(f'RESELECT_VERSION={reselect[-1]}')
          print(f'FAST_EQUALS_VERSION={fast_equals[-1]}')
          PY
          cat /tmp/versions.env
          cat /tmp/versions.env >> "$GITHUB_ENV"

      - name: Build semantic memoization oracle
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p b02-oracle
          cat > b02-oracle/package.json <<JSON
          {
            "private": true,
            "dependencies": {
              "reselect": "${RESELECT_VERSION}",
              "fast-equals": "${FAST_EQUALS_VERSION}"
            }
          }
          JSON

          cat > b02-oracle/oracle.cjs <<'JS'
          const {
            createSelector,
            createSelectorCreator,
            lruMemoize,
          } = require('reselect');
          const { deepEqual } = require('fast-equals');

          const mode = process.env.MODE;
          const expectedAlternating = Number(process.env.EXPECTED_ALTERNATING);
          const createDeepEqualSelector = createSelectorCreator(lruMemoize, deepEqual);

          const selectAssets = (state) => state.assets;
          const selectStakedAssets = (state) => state.stakedAssets;
          const selectCache = (state) => state.cache;

          const state = {
            assets: {
              '0x1': [
                { assetId: 'A', chainId: '0x1', isStaked: false, name: 'Asset A' },
                { assetId: 'B', chainId: '0x1', isStaked: false, name: 'Asset B' },
              ],
            },
            stakedAssets: [],
            cache: {},
          };

          function makeSelector() {
            const resultFn = (assets, _staked, _cache, addressOrParams, maybeChainId, maybeIsStaked) => {
              let address;
              let chainId;
              let isStaked;
              if (mode === 'deep_equal_lru') {
                ({ address, chainId, isStaked } = addressOrParams);
              } else {
                address = addressOrParams;
                chainId = maybeChainId;
                isStaked = maybeIsStaked;
              }
              return assets[chainId]?.find(
                (item) => item.assetId === address && Boolean(item.isStaked) === Boolean(isStaked),
              );
            };

            if (mode === 'deep_equal_lru') {
              return createDeepEqualSelector(
                [
                  selectAssets,
                  selectStakedAssets,
                  selectCache,
                  (_state, params) => params,
                ],
                resultFn,
              );
            }
            if (mode === 'primitive_weakmap') {
              return createSelector(
                [
                  selectAssets,
                  selectStakedAssets,
                  selectCache,
                  (_state, params) => params.address,
                  (_state, params) => params.chainId,
                  (_state, params) => params.isStaked,
                ],
                resultFn,
              );
            }
            throw new Error(`Unknown mode ${mode}`);
          }

          const invoke = (selector, address) =>
            selector(state, { address, chainId: '0x1', isStaked: false });

          // Independent control: repeated equivalent values supplied through fresh
          // parameter objects should execute the result function only once.
          const controlSelector = makeSelector();
          for (let i = 0; i < 6; i += 1) {
            const out = invoke(controlSelector, 'A');
            if (!out || out.name !== 'Asset A') throw new Error('control functional result mismatch');
          }
          const controlRecomputations = controlSelector.recomputations();
          if (controlRecomputations !== 1) {
            throw new Error(`control recomputations expected 1, got ${controlRecomputations}`);
          }

          // Primary oracle: a token list alternates parameter sets against one
          // shared selector. The pre-fix deep-equal LRU result cache has one entry
          // and thrashes. Reselect 5 createSelector uses WeakMap memoization for
          // the split primitive inputs, retaining both parameter combinations.
          const alternatingSelector = makeSelector();
          const sequence = ['A', 'B', 'A', 'B', 'A', 'B'];
          for (const address of sequence) {
            const out = invoke(alternatingSelector, address);
            if (!out || out.assetId !== address) throw new Error(`alternating functional mismatch for ${address}`);
          }
          const alternatingRecomputations = alternatingSelector.recomputations();

          console.log(JSON.stringify({
            reselectVersion: require('reselect/package.json').version,
            mode,
            controlRecomputations,
            alternatingRecomputations,
            expectedAlternating,
          }, null, 2));

          if (alternatingRecomputations !== expectedAlternating) {
            throw new Error(
              `alternating recomputations expected ${expectedAlternating}, got ${alternatingRecomputations}`,
            );
          }
          JS

      - name: Install exact direct historical memoization dependencies
        working-directory: b02-oracle
        shell: bash
        run: npm install --no-audit --no-fund

      - name: Run B02 semantic oracle
        id: oracle
        working-directory: b02-oracle
        shell: bash
        env:
          MODE: ${{ matrix.case.implementation }}
          EXPECTED_ALTERNATING: ${{ matrix.case.expected_alternating_recomputations }}
        run: |
          set -o pipefail
          node oracle.cjs 2>&1 | tee b02-oracle.log

      - name: Write machine-readable evidence
        if: always()
        shell: bash
        run: |
          mkdir -p evidence
          cp b02-oracle/b02-oracle.log evidence/ 2>/dev/null || true
          cat > evidence/B02-${{ matrix.case.name }}.json <<JSON
          {
            "schema_version": "1.1",
            "benchmark_id": "B02",
            "case": "${{ matrix.case.name }}",
            "source_sha": "${{ matrix.case.sha }}",
            "implementation": "${{ matrix.case.implementation }}",
            "reselect_version": "${RESELECT_VERSION}",
            "fast_equals_version": "${FAST_EQUALS_VERSION}",
            "expected_alternating_recomputations": "${{ matrix.case.expected_alternating_recomputations }}",
            "workflow_run_id": "${{ github.run_id }}",
            "workflow_run_attempt": "${{ github.run_attempt }}"
          }
          JSON

      - name: Upload B02 evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: B02-${{ matrix.case.name }}-evidence
          path: evidence/
