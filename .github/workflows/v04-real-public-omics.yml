name: v0.4 real public omics capability

on:
  workflow_dispatch:
    inputs:
      execute_real_public_omics:
        description: 'Run the locked real public-omics capability scenario'
        required: true
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: v04-real-public-omics
  cancel-in-progress: false

jobs:
  real-public-omics:
    if: ${{ inputs.execute_real_public_omics == true }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      RUN_DIR: runs/v04-${{ github.run_id }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12.14'
          cache: pip

      - name: Install locked Python kernel
        run: python -m pip install -e .

      - name: Verify frozen Python scientific stack
        run: |
          python - <<'PY'
          import importlib.metadata as md, json, platform
          lock=json.load(open('environments/python-stack-lock.json'))
          assert platform.python_version() == lock['python'], (platform.python_version(), lock['python'])
          for package, expected in lock['packages'].items():
              observed=md.version(package)
              assert observed == expected, (package, observed, expected)
          print('Frozen Python stack verified')
          PY

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: '4.6.1'
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          packages: |
            any::jsonlite
            bioc::DESeq2
          dependencies: 'NA'
          cache: always

      - name: Verify frozen v0.4 R stack
        run: |
          Rscript -e 'lock <- jsonlite::fromJSON("environments/v04-r-stack-lock.json"); stopifnot(as.character(getRversion()) == lock$r); for (p in names(lock$packages)) stopifnot(as.character(packageVersion(p)) == lock$packages[[p]]); cat("Frozen v0.4 R stack verified\n")'

      - name: Freeze public count assets and create pre-outcome Analysis Lock
        run: python scripts/v04_prepare_scenario.py --run-dir "$RUN_DIR"

      - name: Execute locked DESeq2 analysis on real public counts
        run: Rscript scripts/v04_real_de.R "$RUN_DIR"

      - name: Execute exact-build custom-background enrichment
        run: python scripts/v04_enrich.py "$RUN_DIR"

      - name: Record R session before final bundle audit
        run: Rscript -e 'sessionInfo()' > "$RUN_DIR/r_session_info.txt"

      - name: Run hostile provenance and scientific bundle audit
        run: python scripts/v04_verify_bundle.py "$RUN_DIR"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v04-real-public-omics-${{ github.run_id }}
          path: ${{ env.RUN_DIR }}
          if-no-files-found: warn
