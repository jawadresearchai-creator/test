name: v0.4 real public omics capability

on:
  workflow_call:
    inputs:
      execute_real_public_omics:
        required: true
        type: boolean
  workflow_dispatch:
    inputs:
      execute_real_public_omics:
        description: 'Run the locked real public-omics capability scenario'
        required: true
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: v04-real-public-omics-${{ github.ref }}
  cancel-in-progress: false

jobs:
  real-public-omics:
    if: ${{ inputs.execute_real_public_omics == true }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      RUN_DIR: runs/v04-${{ github.run_id }}
      PYTHONPATH: ${{ github.workspace }}/src
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12.14'
          cache: pip

      - name: Install exact frozen Python scientific stack
        run: |
          python - <<'PY' > /tmp/v04-python-requirements.txt
          import json
          lock=json.load(open('environments/python-stack-lock.json'))
          for package, version in lock['packages'].items():
              print(f'{package}=={version}')
          PY
          python -m pip install -r /tmp/v04-python-requirements.txt

      - name: Verify frozen Python scientific stack
        run: |
          python - <<'PY'
          import importlib.metadata as md, json, platform
          lock=json.load(open('environments/python-stack-lock.json'))
          assert platform.python_version() == lock['python'], (platform.python_version(), lock['python'])
          for package, expected in lock['packages'].items():
              observed=md.version(package)
              assert observed == expected, (package, observed, expected)
          print('Frozen Python stack verified')
          PY

      - name: Run deterministic kernel and v0.4 contracts before outcome access
        run: pytest -q

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: '4.6.1'
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          packages: |
            any::jsonlite
            bioc::DESeq2
          dependencies: 'NA'
          cache: always

      - name: Verify frozen v0.4 R stack
        run: |
          Rscript -e 'lock <- jsonlite::fromJSON("environments/v04-r-stack-lock.json"); stopifnot(as.character(getRversion()) == lock$r); for (p in names(lock$packages)) stopifnot(as.character(packageVersion(p)) == lock$packages[[p]]); cat("Frozen v0.4 R stack verified\n")'

      - name: Freeze public count assets and create pre-outcome Analysis Lock
        run: python scripts/v04_prepare_scenario.py --run-dir "$RUN_DIR"

      - name: Record Python runtime evidence
        run: |
          python - <<'PY'
          import importlib.metadata as md, json, os, platform
          lock=json.load(open('environments/python-stack-lock.json'))
          report={
            'python': platform.python_version(),
            'platform': platform.platform(),
            'packages': {p: md.version(p) for p in lock['packages']},
            'github_sha': os.environ.get('GITHUB_SHA'),
            'github_run_id': os.environ.get('GITHUB_RUN_ID'),
          }
          with open(os.path.join(os.environ['RUN_DIR'], 'python_session_info.json'), 'w') as fh:
              json.dump(report, fh, indent=2, sort_keys=True)
              fh.write('\n')
          PY

      - name: Record R runtime evidence
        run: |
          Rscript - <<'RS'
          lock <- jsonlite::fromJSON('environments/v04-r-stack-lock.json')
          report <- list(
            r = as.character(getRversion()),
            platform = R.version$platform,
            packages = as.list(setNames(vapply(names(lock$packages), function(p) as.character(packageVersion(p)), character(1)), names(lock$packages))),
            github_sha = Sys.getenv('GITHUB_SHA', unset = NA_character_),
            github_run_id = Sys.getenv('GITHUB_RUN_ID', unset = NA_character_),
            github_run_attempt = Sys.getenv('GITHUB_RUN_ATTEMPT', unset = NA_character_)
          )
          jsonlite::write_json(report, file.path(Sys.getenv('RUN_DIR'), 'r_session_info.json'), pretty = TRUE, auto_unbox = TRUE, null = 'null')
          writeLines(capture.output(sessionInfo()), file.path(Sys.getenv('RUN_DIR'), 'r_session_info.txt'))
          RS

      - name: Execute locked DESeq2 analysis on real public counts
        run: Rscript scripts/v04_real_de.R "$RUN_DIR"

      - name: Execute exact-build custom-background enrichment
        run: python scripts/v04_enrich.py "$RUN_DIR"

      - name: Run hostile provenance and scientific bundle audit
        run: python scripts/v04_verify_bundle.py "$RUN_DIR"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v04-real-public-omics-${{ github.run_id }}
          path: ${{ env.RUN_DIR }}
          if-no-files-found: warn
