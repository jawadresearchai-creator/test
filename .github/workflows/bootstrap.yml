name: Bootstrap isolated Agriculture CoScientist

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  bootstrap:
    if: ${{ !contains(github.event.head_commit.message, '[bootstrap-expanded]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Expand source-only bundle without changing workflows
        shell: bash
        run: |
          set -euo pipefail
          cat bootstrap/chunk00 bootstrap/chunk01 bootstrap/chunk02 | base64 -d > /tmp/test.zip
          unzip -q /tmp/test.zip -d /tmp/expanded
          find /tmp/expanded/test -mindepth 1 -maxdepth 1 ! -name .github -exec cp -a {} . \;
          rm -rf bootstrap
          test -f pyproject.toml
          test -f scripts/r_omics_smoke.R
          python - <<'PY'
          import hashlib
          print('bundle_sha256=' + hashlib.sha256(open('/tmp/test.zip','rb').read()).hexdigest())
          PY

      - name: Commit expanded isolated kernel
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Expand isolated Agriculture CoScientist test kernel [bootstrap-expanded]"
          git push
