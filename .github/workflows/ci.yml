name: agriculture-coscientist-test-ci

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  python-kernel:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install kernel and test stack
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[test]'
          python -m pip install biopython requests scipy
      - name: Run Python contract suite from repository root
        run: python -m pytest -q
      - name: Run Python contract suite from external working directory
        run: |
          cd /tmp
          python -m pytest -q "$GITHUB_WORKSPACE/tests"
      - name: CLI capability probe
        run: python -m agri_coscientist | tee python-capabilities.json
      - uses: actions/upload-artifact@v4
        with:
          name: python-capability-report
          path: python-capabilities.json

  r-omics-stack:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: '4.6.1'
          use-public-rspm: true
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: |
            any::jsonlite
            any::WGCNA
            bioc::DESeq2
            bioc::edgeR
            bioc::limma
          cache-version: 1
      - name: Verify R stack
        run: Rscript r/verify_stack.R
      - name: Execute R omics smoke pipeline
        run: Rscript r/smoke_omics.R
      - name: Record R session
        run: Rscript -e 'sessionInfo()' > r-session-info.txt
      - uses: actions/upload-artifact@v4
        with:
          name: r-omics-capability-report
          path: |
            r-smoke-report.json
            r-session-info.txt
