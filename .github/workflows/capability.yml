  study-design-freeze-court:
    if: ${{ github.event_name != 'workflow_dispatch' || github.ref != 'refs/heads/feature/v0.4-real-public-omics' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
