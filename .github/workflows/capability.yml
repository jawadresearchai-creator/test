      - name: Install feasibility kernel
        run: python -m pip install -e .
      - name: Exercise multidimensional feasibility and route rescue court
        run: python scripts/feasibility_route_capability.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: feasibility-route-capability-evidence
          path: feasibility_route_capability.json
