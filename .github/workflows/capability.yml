  dataset-freeze-court:
    if: ${{ github.event_name != 'workflow_dispatch' || github.ref != 'refs/heads/feature/v0.4-real-public-omics' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12.14'
          cache: pip
      - name: Install Dataset Freeze kernel
        run: python -m pip install -e .
      - name: Exercise route-aware project Dataset Freeze court
        run: python scripts/dataset_freeze_capability.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dataset-freeze-capability-evidence
          path: dataset_freeze_capability.json
          if-no-files-found: error

  analysis-specification-lock-court:
    if: ${{ github.event_name != 'workflow_dispatch' || github.ref != 'refs/heads/feature/v0.4-real-public-omics' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12.14'
          cache: pip
      - name: Install Analysis Specification kernel
        run: python -m pip install -e .
      - name: Exercise Analysis Specification Court and Analysis Lock
        run: python scripts/analysis_specification_capability.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: analysis-specification-lock-capability-evidence
          path: analysis_specification_capability.json
          if-no-files-found: error

  v04-real-public-omics:
    if: ${{ (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/feature/v0.4-real-public-omics') || (github.event_name == 'pull_request' && github.head_ref == 'feature/v0.4-real-public-omics') }}
    uses: ./.github/workflows/v04-real-public-omics.yml
    with:
      execute_real_public_omics: true
    secrets: inherit
