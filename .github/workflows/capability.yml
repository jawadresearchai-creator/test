name: Agriculture CoScientist capability suite

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: '17 3 * * 1'

permissions:
  contents: read

concurrency:
  group: agriculture-coscientist-capability-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python-kernel:
    if: ${{ github.event_name != 'workflow_dispatch' || github.ref != 'refs/heads/feature/v0.4-real-public-omics' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12.14'
          cache: pip
      - name: Install isolated kernel and tests
        run: python -m pip install --upgrade pip && python -m pip install -e '.[test]'
      - name: Verify frozen Python package versions
        run: |
          python - <<'PY'
          import importlib.metadata as md, json, platform
          lock=json.load(open('environments/python-stack-lock.json'))
          assert platform.python_version() == lock['python'], (platform.python_version(), lock['python'])
          for package, expected in lock['packages'].items():
              observed=md.version(package)
              assert observed == expected, (package, observed, expected)
          print('Frozen Python stack verified')
          PY
      - name: Run full Python contract suite
        run: pytest -q
      - name: CLI smoke test
        run: python -m agri_coscientist > cli_output.json
      - name: Verify package can run from outside repository cwd
        run: |
          cd /tmp
          python -c "import agri_coscientist; print(agri_coscientist.__file__)"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: python-capability-evidence
          path: cli_output.json
          if-no-files-found: ignore

  r-omics:
    if: ${{ github.event_name != 'workflow_dispatch' || github.ref != 'refs/heads/feature/v0.4-real-public-omics' }}
    runs-on: ubuntu-latest
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: '4.6.1'
          use-public-rspm: true
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          packages: |
            any::jsonlite
            any::WGCNA
            bioc::DESeq2
            bioc::edgeR
            bioc::limma
            bioc::GEOquery
          dependencies: 'NA'
          cache: always
      - name: Verify frozen R package versions
        run: |
          Rscript -e 'lock <- jsonlite::fromJSON("environments/r-stack-lock.json"); stopifnot(as.character(getRversion()) == lock$r); for (p in names(lock$packages)) stopifnot(as.character(packageVersion(p)) == lock$packages[[p]])'
      - name: Run production-R capability smoke suite
        run: Rscript scripts/r_omics_smoke.R
      - name: Record R session
        run: Rscript -e 'sessionInfo()' > r_session_info.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: r-omics-capability-evidence
          path: |
            r_omics_smoke.json
            r_session_info.txt
          if-no-files-found: ignore

  public-data-live:
    if: ${{ github.event_name != 'workflow_dispatch' || github.ref != 'refs/heads/feature/v0.4-real-public-omics' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12.14'
      - name: Install kernel for live repository adapter
        run: python -m pip install -e .
      - name: Download and hash a real public wheat GEO count file
        run: python scripts/live_geo_probe.py
      - name: Exercise kernel GEOAdapter against live family SOFT
        run: python scripts/live_geo_adapter.py
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: '4.6.1'
          use-public-rspm: true
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          packages: |
            any::jsonlite
            bioc::GEOquery
          dependencies: 'NA'
          cache: always
      - name: Fetch current wheat GEO series metadata through GEOquery
        run: Rscript scripts/live_geo_metadata.R
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: live-public-data-evidence
          path: |
            live_geo_probe.json
            live_geo_adapter.json
            live_geo_metadata.json
          if-no-files-found: ignore

  annotation-enrichment-live:
    if: ${{ github.event_name != 'workflow_dispatch' || github.ref != 'refs/heads/feature/v0.4-real-public-omics' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12.14'
          cache: pip
      - name: Install annotation/enrichment kernel
        run: python -m pip install -e .
      - name: Exercise build-aware Ensembl and g:Profiler adapters
        run: python scripts/live_wheat_annotation_enrichment.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: live-wheat-annotation-enrichment-evidence
          path: live_wheat_annotation_enrichment.json
          if-no-files-found: ignore

  literature-novelty-live:
    if: ${{ github.event_name != 'workflow_dispatch' || github.ref != 'refs/heads/feature/v0.4-real-public-omics' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12.14'
          cache: pip
      - name: Install discovery/novelty kernel
        run: python -m pip install -e .
      - name: Exercise Europe PMC + OpenAlex + Crossref scoped novelty court
        run: python scripts/live_literature_novelty.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: live-literature-novelty-evidence
          path: live_literature_novelty.json
          if-no-files-found: ignore

  feasibility-route-court:
    if: ${{ github.event_name != 'workflow_dispatch' || github.ref != 'refs/heads/feature/v0.4-real-public-omics' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12.14'
