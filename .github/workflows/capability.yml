          cache: pip
      - name: Install Study Design kernel
        run: python -m pip install -e .
      - name: Exercise route-aware Study Design Court and Design Freeze
        run: python scripts/study_design_capability.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: study-design-freeze-capability-evidence
